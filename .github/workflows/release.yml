name: Release

# A tag v* builds the AppImage and the Windows zip and publishes them as assets
# of a GitHub Release. workflow_dispatch builds the same artifacts without
# publishing anything, to test the pipeline by hand. Neither build needs the ROM:
# the packages carry no game data, and the checks below fail if a .pak or .nes
# shows up in them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: AppImage (Ubuntu 22.04 container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build AppImage
        run: scripts/package-appimage.sh
      - name: Check AppImage has no game data
        run: |
          work=$(mktemp -d)
          cp dist/*.AppImage "$work/app.AppImage"
          chmod +x "$work/app.AppImage"
          (cd "$work" && ./app.AppImage --appimage-extract >/dev/null)
          find "$work/squashfs-root" -type f > "$work/listing.txt"
          cat "$work/listing.txt"
          if grep -qiE '\.(pak|nes)$' "$work/listing.txt"; then
            echo "game data found in the AppImage" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows zip (cross-built with mingw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install mingw and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip
      - name: Build Windows zip
        run: scripts/package-windows.sh
      - name: Check zip has no game data
        run: |
          if unzip -Z1 dist/*.zip | grep -qiE '\.(pak|nes)$'; then
            unzip -Z1 dist/*.zip >&2
            echo "game data found in the Windows zip" >&2
            exit 1
          fi
          unzip -Z1 dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
